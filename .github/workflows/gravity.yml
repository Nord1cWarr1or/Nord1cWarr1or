name: gravity

on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gravity.yml"

permissions:
  contents: write

jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build gravity animation
        uses: flycran/github-gravity@v1
        with:
          username: Nord1cWarr1or
          text: CS 1.6
          output-path: deploy/gravity.svg
          text-color: "#7aa2f7"

      - name: Publish to gravity-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gravity-output
          build_dir: deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
