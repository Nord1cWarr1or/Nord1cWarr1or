name: Generate stat cards

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summary cards (tokyonight, dark)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
          UTC_OFFSET: 3
          AUTO_PUSH: false

      - name: Stage tokyonight cards
        run: |
          mkdir -p cards/tokyonight
          cp profile-summary-card-output/tokyonight/*.svg cards/tokyonight/

      - name: Summary cards (default, light)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: default
          UTC_OFFSET: 3
          AUTO_PUSH: false

      - name: Stage default cards
        run: |
          mkdir -p cards/default
          cp profile-summary-card-output/default/*.svg cards/default/

      - name: Streak (tokyonight, dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak-tokyonight.svg

      - name: Streak (default, light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true
          path: profile/streak-default.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add cards profile
          git diff --cached --quiet || git commit -m "cards: daily refresh"
          git pull --rebase origin main
          git push
